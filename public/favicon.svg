<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#061a13"/>
      <stop offset="55%" stop-color="#0b2f22"/>
      <stop offset="100%" stop-color="#020706"/>
    </linearGradient>

    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#d9e2df"/>
      <stop offset="100%" stop-color="#9baaa5"/>
    </linearGradient>

    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8affcf"/>
      <stop offset="35%" stop-color="#16d98b"/>
      <stop offset="100%" stop-color="#087a4e"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Emerald atmospheric glow -->
  <circle
    cx="256"
    cy="270"
    r="150"
    fill="#00d084"
    opacity="0.13"
    filter="url(#softGlow)"
  />

  <!-- Emerald orbit -->
  <ellipse
    cx="256"
    cy="260"
    rx="184"
    ry="122"
    fill="none"
    stroke="url(#emerald)"
    stroke-width="10"
    opacity="0.72"
    transform="rotate(-24 256 260)"
  />

  <!-- Document -->
  <path
    d="M156 86
       H303
       L372 155
       V407
       C372 425 357 440 339 440
       H156
       C138 440 123 425 123 407
       V119
       C123 101 138 86 156 86Z"
    fill="url(#paper)"
  />

  <!-- Fold -->
  <path
    d="M303 86
       V143
       C303 153 311 161 321 161
       H372
       Z"
    fill="#aebbb7"
  />

  <!-- PDF mark -->
  <path
    d="M164 229
       C186 208 216 205 240 218
       C257 227 267 241 279 255
       C294 272 311 286 337 287"
    fill="none"
    stroke="url(#emerald)"
    stroke-width="19"
    stroke-linecap="round"
    filter="url(#glow)"
  />

  <path
    d="M165 229
       C187 209 216 207 239 219
       C257 228 267 242 279 256
       C294 273 311 286 337 287"
    fill="none"
    stroke="#ffffff"
    stroke-width="7"
    stroke-linecap="round"
  />

  <!-- Lower emerald accent -->
  <path
    d="M168 331 H326"
    stroke="#16d98b"
    stroke-width="13"
    stroke-linecap="round"
  />

  <path
    d="M168 365 H289"
    stroke="#879791"
    stroke-width="10"
    stroke-linecap="round"
  />

  <!-- Orbit highlight -->
  <circle
    cx="420"
    cy="177"
    r="13"
    fill="#8affcf"
    filter="url(#glow)"
  />
</svg>
